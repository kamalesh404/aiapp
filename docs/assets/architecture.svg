<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="320">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1e33"/>
      <stop offset="100%" stop-color="#05101c"/>
    </linearGradient>
  </defs>

  <rect width="880" height="320" rx="12" fill="#030b14" stroke="#0e2a47"/>
  <text x="440" y="38" font-family="sans-serif" font-size="18" font-weight="700" fill="#f0f9ff" text-anchor="middle">
    aiapp Dual-Mode Hybrid Architecture (Cloud &amp; Offline)
  </text>

  <!-- Presentation Layer -->
  <g transform="translate(40, 75)">
    <rect width="230" height="195" rx="8" fill="url(#cardBg)" stroke="#1d4872"/>
    <text x="115" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">1. Presentation &amp; State</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#93c5fd">• Material 3 UI Screens</text>
    <text x="20" y="90" font-family="sans-serif" font-size="12" fill="#93c5fd">• Provider &amp; Riverpod</text>
    <text x="20" y="115" font-family="sans-serif" font-size="12" fill="#93c5fd">• Chat &amp; Image Workflows</text>
    <text x="20" y="140" font-family="sans-serif" font-size="12" fill="#93c5fd">• History &amp; Settings</text>
    <text x="20" y="165" font-family="sans-serif" font-size="12" fill="#60a5fa">lib/features/</text>
  </g>

  <!-- Engine: Online vs Offline -->
  <g transform="translate(325, 75)">
    <rect width="230" height="195" rx="8" fill="url(#cardBg)" stroke="#10b981"/>
    <text x="115" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">2. Dual Inference Engine</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#93c5fd">• Online: OpenAI GPT-3.5/4</text>
    <text x="20" y="90" font-family="sans-serif" font-size="12" fill="#93c5fd">• Online: DALL-E 3 Generation</text>
    <text x="20" y="115" font-family="sans-serif" font-size="12" fill="#93c5fd">• Offline: Keyword Logic Engine</text>
    <text x="20" y="140" font-family="sans-serif" font-size="12" fill="#93c5fd">• Offline: Procedural 2D Synthesizer</text>
    <text x="20" y="165" font-family="sans-serif" font-size="12" fill="#6ee7b7">lib/data/services &amp; lib/ml/</text>
  </g>

  <!-- Persistence Layer -->
  <g transform="translate(610, 75)">
    <rect width="230" height="195" rx="8" fill="url(#cardBg)" stroke="#a855f7"/>
    <text x="115" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#a855f7" text-anchor="middle">3. Local Storage</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#93c5fd">• Hive TypeAdapters (0, 1, 2)</text>
    <text x="20" y="90" font-family="sans-serif" font-size="12" fill="#93c5fd">• ChatMessage &amp; GeneratedImage</text>
    <text x="20" y="115" font-family="sans-serif" font-size="12" fill="#93c5fd">• SharedPreferences Settings</text>
    <text x="20" y="140" font-family="sans-serif" font-size="12" fill="#93c5fd">• Offline Session Persistence</text>
    <text x="20" y="165" font-family="sans-serif" font-size="12" fill="#c084fc">lib/data/models/</text>
  </g>

  <!-- Connectors -->
  <line x1="270" y1="172" x2="325" y2="172" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="325,172 317,167 317,177" fill="#38bdf8"/>

  <line x1="555" y1="172" x2="610" y2="172" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="610,172 602,167 602,177" fill="#10b981"/>
</svg>
